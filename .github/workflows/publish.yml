name: Publish

on:
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC (trusted publishing) and provenance
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set node version to 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: 'pnpm'
          # Needed so NODE_AUTH_TOKEN is written into .npmrc for the very first publish.
          # Once trusted publishing is configured on npmjs.com this is redundant but harmless.
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare
        run: pnpm install --frozen-lockfile

      - name: Publish
        run: |
          PACKAGE_DIST_TAG=$(node -e "console.log(/^\d+\.\d+\.\d+(\-(\w+)\.\d+)$/.exec(require('./package.json').version)?.[2] || 'latest')")
          pnpm publish --access public --tag $PACKAGE_DIST_TAG --provenance
        env:
          # Only needed until this package exists on npm and a Trusted Publisher is
          # configured for it. Delete the secret and this block afterwards — OIDC replaces it.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
