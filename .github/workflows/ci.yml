name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run format:check

      - run: pnpm run typecheck

      - run: pnpm run publint

  test:
    name: Node ${{ matrix.node }} / TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        # TypeScript 7 dropped the JS language service, so it is deliberately not tested:
        # the plugin refuses to run on it. See README, "TypeScript version support".
        typescript: ['5', '6']
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pin TypeScript ${{ matrix.typescript }}
        run: pnpm add -D typescript@${{ matrix.typescript }}

      - name: Report resolved TypeScript
        run: pnpm exec tsc --version

      - run: pnpm run test
